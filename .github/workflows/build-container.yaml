name: Build Unifi Backup Exporter

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - dev

    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build Container Image

    permissions:
      contents: read
      id-token: write

    uses: konkele-homelab/ci-platform/.github/workflows/build-container.yaml@v2

    with:
      image_name: unifi-backup-exporter
      dockerfile: Dockerfile
      runner: ci-build